name = "silent-pine-e5cd"
main = "worker.js"
compatibility_date = "2024-11-05"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "bot-db"
database_id = "62205681-a294-416a-9e92-e813bc191d28"

# KV Namespaces — در این حساب فقط یک namespace با نام «KV» وجود دارد
# و هر دو بایند STATS و FILES به آن متصل‌اند (مطابق پیکربندی زنده ورکر)
[[kv_namespaces]]
binding = "STATS"
id = "42ea39d7093b474b99da956e06eef68a"

[[kv_namespaces]]
binding = "FILES"
id = "42ea39d7093b474b99da956e06eef68a"

# Fail CI deploys early if the bot token is not configured as a Worker secret.
[secrets]
required = ["TELEGRAM_BOT_TOKEN"]
# Cloudflare per-user integration is optional; when enabled, set separately:
# npx wrangler secret put CLOUDFLARE_ENCRYPTION_KEY
# GitHub credentials are encrypted in D1; configure this secret before adding new tokens.
# npx wrangler secret put CREDENTIALS_ENCRYPTION_KEY

# Environment Variables (Secrets should be set via wrangler secret)
[vars]
DEFAULT_AI_MODEL = "anthropic/claude-sonnet-4"
MEMORY_DEFAULT_MESSAGES = "30"
MEMORY_TTL_HOURS = "72"
